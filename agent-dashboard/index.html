<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>502ai · Agent dashboard (live team activity)</title><meta name="description" content="Public, censored view of the 502ai agent team: activity, flows, step chains and leaderboard."><meta name="robots" content="noindex"><meta name="theme-color" content="#0b1424">
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<header id="top">
  <div id="crumbs"><span class="brand">502<em>ai</em></span><span class="sep">/</span><span>502ai</span><span class="sep">/</span><span>agent dashboard</span><span class="sep">·</span><span class="pubnote" title="Public censored snapshot. Client, lead and business names, contacts, hosts, IDs, file locations, code references and message details are removed.">public · censored</span></div>
  <span id="mode" hidden></span><div id="live" title="Live status"><span class="ld"></span><span id="livetx">connecting…</span></div>
  <div id="metrics"></div>
  <div id="toggle"><button data-s="o" class="on" title="System map: explorable 3D org chart (O)" data-ic="system"><kbd>O</kbd></button><button data-s="a" title="Pipeline dashboard (D)" data-ic="dashboard"><kbd>D</kbd></button><button data-s="b" title="Network view (N)" data-ic="network"><kbd>N</kbd></button><button id="stylebtn" title="Switch the system-map design (arcade / constellation / classic)" data-ic="gamepad"></button><button id="lgbtn" title="Agent colours legend (G)" data-ic="legend"></button><button id="theme" title="Switch to light mode (L)"></button><button id="pause" style="display:none" title="Pause/play rotation (Space)">❚❚ pause rotation</button></div>
</header>
<section id="gate">
  <div id="gwait" class="half"><span class="hd" title="Decisions pending the owner (details private)" data-ic="hourglass"><b class="badge" id="wcount">0</b></span><div class="chips" id="wchips"></div></div>
  <div style="display:none"><b id="bcount"></b><div id="bchips"></div></div>
</section>
<main id="stage">
  <div id="orgwrap" class="scene"><canvas id="org"></canvas><div id="olabels"></div>
    <aside id="feed" class="glass"><div class="rh"><span data-ic="radio"></span>live stream<span class="rs" title="Each card lights up when a real logged event replays and fades when it is done">replay of real events</span></div><div id="feedl"></div></aside>
    <aside id="insp" class="glass"><div id="inspb"></div><div id="lbmini"></div></aside>
    <div id="scrub" class="glass"><button id="tplay" title="Pause / play the replay (Space)"></button><button id="tspeed" title="Replay speed"></button><div id="track" title="Timeline of every loaded event, coloured by agent. Drag to scrub."><canvas id="trackc"></canvas><i id="thead"></i></div><span id="tclock"></span><button id="ttour" title="Guided tour (T)"></button><button id="treset" title="Reset view (R)"></button></div>
    <div id="ocap" hidden></div>
    <div id="mfab"></div><div id="mcard" hidden></div><div id="mleg" hidden></div><div id="mhint" aria-hidden="true"></div><span id="mlive" aria-hidden="true"></span>
  </div>
  <canvas id="pipe" class="scene"></canvas>
  <div id="nebwrap" class="scene"><canvas id="neb"></canvas><div id="labels"></div>
    <div id="nebhud"><div class="h">team nebula</div><div class="s">ceo core · agent hubs · tracers = replayed real events · dashed = unknown count</div><div id="nebev"></div></div></div>
  <aside id="legend" hidden></aside>
  <aside id="drawer" hidden>
    <div class="tabs"><button data-tab="sources">sources</button><button id="dclose" title="Close (Esc)">×</button></div>
    <div id="dbody"></div>
  </aside>
  </main>
<div id="tip" hidden></div>
<footer id="bottom">
  <div id="ticker"></div>
  <div id="foot"></div>
</footer>
<script>window.DASH_PUBLIC = true;</script>
<script src="data.js"></script>
<script type="module" src="app.js"></script>
</body></html>
